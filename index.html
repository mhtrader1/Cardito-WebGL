      html, body {

    <!-- =========== Buiding DeviceId ===========-->
    <script>
    (function() {
      function generateDeviceId() {
        const key = "cardito_device_id";
        let id = localStorage.getItem(key);
        if (!id) {
          const rand = crypto.getRandomValues(new Uint8Array(16));
          id = Array.from(rand).map(x => x.toString(16).padStart(2, "0")).join("");
          localStorage.setItem(key, id);
        }
        return id;
      }

      window.CARDITO_DEVICE_ID = generateDeviceId();

      const urlParams = new URLSearchParams(window.location.search);
      const ref = urlParams.get("ref");

      if (ref) {
        localStorage.setItem("cardito_referral_code", ref);
      }

      window.CARDITO_REF_CODE = ref || null;
    })();
    </script>

    <!-- ===== HTML Keyboard Overlay for mobile WebGL ===== -->
    <input id="cardito-html-input"
           type="text"
           style="
             position:fixed;
             left:50%;
             bottom:20px;
             transform:translateX(-50%);
             width:80%;
             max-width:400px;
             height:40px;
             padding:8px 10px;
             font-size:16px;
             border-radius:8px;
             border:1px solid #ccc;
             z-index:999999;
             display:none;
             background:#fff;
             color:#000;
           "
           autocomplete="off"
           autocorrect="off"
           autocapitalize="off"
           spellcheck="false" />

    <script>
      (function () {
        const el = document.getElementById("cardito-html-input");

        const overlay = {
          go: null,
          method: null,

          open(goName, methodName, placeholder, currentValue) {
            this.go = goName;
            this.method = methodName;
            el.placeholder = placeholder || "";
            el.value = currentValue || "";
            el.style.display = "block";

            // کمی تأخیر برای اینکه موبایل مطمئناً کیبورد را باز کند
            setTimeout(() => {
              el.focus();
              el.selectionStart = el.selectionEnd = el.value.length;
            }, 50);
          },

          close(sendBack) {
            el.style.display = "none";

            if (sendBack && this.go && this.method) {
              const val = el.value || "";

              try {
                // اول: اگر sendMessage جهانی ست شده باشد (پس از ساخت UnityInstance)
                if (typeof window.sendMessage === "function") {
                  window.sendMessage(this.go, this.method, val);

                // دوم: اگر خود unityInstance در دسترس باشد
                } else if (typeof window.unityInstance !== "undefined" && window.unityInstance) {
                  window.unityInstance.SendMessage(this.go, this.method, val);

                // سوم: fallback قدیمی WebGL
                } else if (typeof window.SendMessage === "function") {
                  window.SendMessage(this.go, this.method, val);
                } else {
                  console.warn("[HTMLKeyboardOverlay] No bridge ready → input queued");
                  setTimeout(() => {
                    if (typeof window.sendMessage === "function")
                      window.sendMessage(this.go, this.method, val);
                    else if (window.unityInstance)
                      window.unityInstance.SendMessage(this.go, this.method, val);
                  }, 300);
                }

                } catch (e) {
                console.error("[HTMLKeyboardOverlay] SendMessage error", e);
              }
            }

            this.go = null;
            this.method = null;
          }
        };

        el.addEventListener("blur", () => overlay.close(false));

        el.addEventListener("keydown", (e) => {
          if (e.key === "Enter") {
            e.preventDefault();
            overlay.close(true);
          } else if (e.key === "Escape") {
            e.preventDefault();
            overlay.close(false);
          }
        });

        // این آبجکت همان چیزی است که از C# با Application.ExternalCall صدا زده می‌شود
        window.HTMLKeyboardOverlay = overlay;
      })();
    </script>

<!-- ================================
     ⭐ Cardito Cinematic Loader (GSAP)
     ================================= -->
<style>
  #cardito-loader {
    position: fixed;
    inset: 0;
    background: white;
    z-index: 999999;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  .letter,
  #cardito-heart {
    position: absolute;
    bottom: calc(50% - 40px);   /* همه روی یک خط مشترک */
    left: 50%;
    transform: translateX(-50%);
    opacity: 0;
    width: auto;
    height: auto;
  }

  #cardito-heart {
    width: auto;
    pointer-events: none;
  }

  /* 📱 تنظیم اندازه روی موبایل: نسبت‌محور بر اساس ارتفاع/عرض صفحه */
  @media (max-width: 600px) {
    .letter {
      max-height: 12vh;  /* ارتفاع حروف با توجه به ارتفاع صفحه */
      height: auto;
      width: auto;
    }

    #cardito-heart {
      max-height: 4vh;   /* قلب کمی کوچک‌تر از حروف */
      height: auto;
      width: auto;
    }
  }
</style>

<div id="cardito-loader">
  <img class="letter" id="L1" src="1.png">
  <img class="letter" id="L2" src="2.png">
  <img class="letter" id="L3" src="3.png">
  <img class="letter" id="L4" src="4.png">
  <img class="letter" id="L5" src="5.png"> <!-- حرف i بدون نقطه -->
  <img class="letter" id="L6" src="6.png">
  <img class="letter" id="L7" src="7.png">
  <img id="cardito-heart" src="heart.png">
</div>

<!-- GSAP CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

<script>
  // فلگ‌ها
  window.CARDITO_ANIM_DONE = false;
  window.UnityLoadProgress = window.UnityLoadProgress || 0; // از سمت Unity ست می‌شود

  const CARDITO_LETTER_IDS = ["L1", "L2", "L3", "L4", "L5", "L6", "L7"];
  const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || window.innerWidth <= 600;
  let HEART_BEATS = 0;

  // 📏 ابعاد صفحه برای نرمال‌سازی (S20 ≈ 360x800 مبنا)
  const vw = Math.max(document.documentElement.clientWidth || 0, window.innerWidth || 0);
  const vh = Math.max(document.documentElement.clientHeight || 0, window.innerHeight || 0);
  const BASE_WIDTH = 360;
  const BASE_HEIGHT = 800;
  const scaleW = vw / BASE_WIDTH;
  const scaleH = vh > 0 ? (BASE_HEIGHT / vh) : 1; // گوشی کوتاه → offset عمودی بیشتر (قلب بالاتر بره)

  // فقط وقتی سه شرط اوکی شد، لودر محو می‌شود
  function tryStartUnityReveal() {
    const loader = document.getElementById("cardito-loader");
    if (!loader || !window.gsap) return;

    const progress = window.UnityLoadProgress || 0;
    const ready = progress >= 0.9; // حداقل ۹۰٪ لود یونیتی

    if (ready && window.CARDITO_ANIM_DONE && HEART_BEATS >= 5) {
      gsap.to(loader, {
        opacity: 0,
        duration: 0.7,
        onComplete: () => {
          loader.style.display = "none";
        }
      });
    }
  }

  function initCarditoLoader() {
    const loader = document.getElementById("cardito-loader");
    if (!loader) return;

    const letters = CARDITO_LETTER_IDS.map(id => document.getElementById(id));
    const heart = document.getElementById("cardito-heart");

    if (!letters.every(Boolean) || !heart || !window.gsap) {
      // اگر تصاویر یا GSAP آماده نشدند، انیمیشن را نادیده بگیر ولی اجازه بده Unity ادامه دهد
      window.CARDITO_ANIM_DONE = true;
      tryStartUnityReveal(true);
      return;
    }

    requestAnimationFrame(() => {
      (async () => {

        // ⭐ مرحله ۱: تضمین لود کامل و decode کامل تصاویر
        try {
          for (let el of letters) {
            if (el.decode) {
              await el.decode();
            }
          }
        } catch (e) {
          console.warn("[Loader] decode() failed – fallback to naturalWidth");
        }

        // ⭐ مرحله ۲ (نسخه نهایی): محاسبه عرض واقعی (scaled width) بعد از decode
        const widths = [];
        for (let el of letters) {
          if (!el.naturalWidth) {
            await new Promise(r => setTimeout(r, 10));
          }

          const rect = el.getBoundingClientRect();
          let scaledWidth = rect.width || el.naturalWidth || 0;
          if (!scaledWidth) scaledWidth = 1;

          widths.push(scaledWidth);
        }

        let total = widths.reduce((a, b) => a + b, 0);
        const startX = -total / 2;
        const positions = {};
        let cursor = startX;

        for (let i = 0; i < widths.length; i++) {
          let center = cursor + widths[i] / 2;
          positions[CARDITO_LETTER_IDS[i]] = center;
          cursor += widths[i];
        }

        const dropYStart = -vh * 0.5;
        const dropYEnd = 0;

        letters.forEach((el, idx) => {
          const id = CARDITO_LETTER_IDS[idx];
          gsap.set(el, { x: positions[id], y: dropYStart, opacity: 0 });
        });

        gsap.set(heart, { opacity: 0, scale: 0.8 });

        const tl = gsap.timeline({
          defaults: { duration: 1.4, ease: "power2.out" }
        });

        tl.to(letters, {
          y: dropYEnd,
          opacity: 1,
          stagger: 0.15
        }, 0)
        .to({}, { duration: 1 })
        .add(() => {
          const iIndex = CARDITO_LETTER_IDS.indexOf("L5");
          const iEl = letters[iIndex];
          const iRect = iEl.getBoundingClientRect();
          const loaderRect = loader.getBoundingClientRect();

          const offsetX =
            (iRect.left + iRect.width / 2) -
            (loaderRect.left + loaderRect.width / 2);

          const offsetYTopOfI =
            iRect.top - (loaderRect.top + loaderRect.height / 2);

          const baseHeartOffsetY = isMobile ? -30 : -5;
          const heartOffsetY = baseHeartOffsetY * scaleH;

          const finalY = offsetYTopOfI + heartOffsetY;

          gsap.set(heart, { x: offsetX, y: finalY });
        })
        .to(heart, {
          opacity: 1,
          scale: 1,
          duration: 0.45,
          ease: "power2.out"
        })
        .call(() => {
          window.CARDITO_ANIM_DONE = true;

          gsap.to("#cardito-heart", {
            scale: 1.12,
            duration: 0.45,
            ease: "power1.inOut",
            yoyo: true,
            repeat: -1,
            onRepeat: () => {
              HEART_BEATS++;
              tryStartUnityReveal();
            }
          });
        });

      })();
    });
  }

  // لود تصاویر + شروع لودر
  window.addEventListener("load", () => {
    const imgs = CARDITO_LETTER_IDS.map(id => document.getElementById(id));
    const heart = document.getElementById("cardito-heart");
    const all = [...imgs, heart].filter(Boolean);

    let remaining = all.length;
    if (remaining === 0) {
      initCarditoLoader();
      return;
    }

    const done = () => {
      remaining--;
      if (remaining <= 0) initCarditoLoader();
    };

    all.forEach(img => {
      if (img.complete) {
        done();
      } else {
        img.addEventListener("load", done, { once: true });
        img.addEventListener("error", done, { once: true });
      }
    });
  });
</script>


    <!-- ================================
         ⭐ Original Unity Loader
         ================================= -->
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width="1080" height="1920" tabindex="0"></canvas>

      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>

      <div id="unity-warning"></div>
      <div id="unity-footer">
        <div id="unity-webgl-logo"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">Cardito Web</div>
      </div>
    </div>

    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      canvas.tabIndex = 0;
      canvas.style.outline = "none";
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var warningBanner = document.querySelector("#unity-warning");

      window.UnitySelectedChain = 1; // default Ethereum
      window.SetUnitySelectedChain = function(cid){
        console.log("[HTML] Unity selected chain =", cid);
        window.UnitySelectedChain = parseInt(cid);
      };

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? "block" : "none";
        }
        var div = document.createElement("div");
        div.textContent = msg;
        warningBanner.appendChild(div);

        if (type == "error") div.style = "background: red; padding: 10px;";
        else {
          if (type == "warning") div.style = "background: yellow; padding: 10px;";
          setTimeout(() => {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/WebGL.loader.js";

      var config = {
        dataUrl: buildUrl + "/WebGL.data",
        frameworkUrl: buildUrl + "/WebGL.framework.js",
        codeUrl: buildUrl + "/WebGL.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Cardito",
        productName: "Cardito Web",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement("meta");
        meta.name = "viewport";
        meta.content =
          "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";
        document.head.appendChild(meta);
        container.className = "unity-mobile";
        canvas.className = "unity-mobile";
      } else {
        canvas.style.width = "1080px";
        canvas.style.height = "1920px";
      }

      loadingBar.style.display = "block";
      window.UNITY_READY = true;                       // ✅ Unity HTML logo / loading bar is now visible
      console.log("[HTML] UNITY_READY set → Unity logo is visible");

      function waitForIntro() {
        return new Promise(resolve => {
          if (window.CARDITO_ANIM_DONE) return resolve();
          const interval = setInterval(() => {
            if (window.CARDITO_ANIM_DONE) {
              clearInterval(interval);
              resolve();
            }
          }, 100);
        });
      }

      var script = document.createElement("script");
      script.src = loaderUrl;

      script.onload = () => {
        
        waitForIntro().then(() => {
          createUnityInstance(canvas, config, (progress) => {
            // ذخیرهٔ وضعیت لود یونیتی برای لودر
            window.UnityLoadProgress = progress || 0;

            // اگر بعداً خواستی نوار پیشرفت درست کنی همین خط کار می‌کند
            progressBarFull.style.width = (progress * 100) + "%";

            // هر بار که progress آپدیت می‌شود، چک کن لودر می‌تواند محو شود یا نه
            tryStartUnityReveal();
          }).then((unityInstance) => {

            window.sendMessage = function(obj, method, param) {
              try { unityInstance.SendMessage(obj, method, param); }
              catch (e) { console.error("[sendMessage ERROR]", e); }
            };

            loadingBar.style.display = "none";
            fullscreenButton.onclick = () => unityInstance.SetFullscreen(1);

            window.unityInstance = unityInstance;

            window.SendUnityDeviceId = function() {
                if (unityInstance && unityInstance.SendMessage)
                    unityInstance.SendMessage("RegisterManager", "OnDeviceIdFromJS", window.CARDITO_DEVICE_ID);
            };

            window.SendUnityReferral = function() {
                if (unityInstance && unityInstance.SendMessage)
                    unityInstance.SendMessage("RegisterManager", "OnReferralCodeFromJS", window.CARDITO_REF_CODE || "");
            };

          }).catch((msg) => console.error(msg));
        });
      };

      document.body.appendChild(script);
    </script>

    <!-- ======================
         Canvas Fitting Logic
         ====================== -->
    <script>
      function fitCanvas() {
        const canvas = document.getElementById("unity-canvas");
        const scaleX = window.innerWidth / 1080;
        const scaleY = window.innerHeight / 1920;
        const scale = Math.min(scaleX, scaleY);
        canvas.style.setProperty("--scale", scale);
      }

      window.addEventListener("resize", fitCanvas);
      fitCanvas();
    </script>

  </body>
